name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Prepare Assets & Capacitor
        run: |
          mkdir -p www
          cp -r *.html *.css *.js webfonts www/ 2>/dev/null || true
          cp -r *.woff2 www/ 2>/dev/null || true
          npm install
          npx cap add android
          npx cap sync android

      - name: Build Debug APK with Gradle
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk GearForge3D.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GearForge3D-Android-APK
          path: GearForge3D.apk
          if-no-files-found: error

      - name: Publish or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "GearForge 3D - Latest Release"
          body: "Official Swiss3D-standard Android APK build for GearForge 3D. Download directly to install on your phone."
          files: GearForge3D.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
